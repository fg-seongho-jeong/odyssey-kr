# CGV 예매 오픈 감시 설정

theater:
  site_no: "0199"
  name: "CGV 천호"

movie:
  # movNm(영화명)에 포함되면 매칭. 여러 개 등록 가능.
  match:
    - "오디세이"

screen:
  # scnsNm(상영관명)에 포함되면 매칭. 비우면([]) 모든 상영관 대상.
  match:
    - "IMAX관"

watch:
  # 구독자별 날짜/시간대는 텔레그램에서 /start로 각자 설정한다(subscribers.json).
  # 아래 값은 최초 구독자(.env의 TELEGRAM_CHAT_ID)의 기본값으로만 쓰인다.
  start_date: "2026-09-04"
  end_date: "2026-09-06"
  # HH:MM, 24시간 표기. 심야 회차의 24시 이후 표기(예: 2400, 2500)는 이 범위로 자연히 제외됨.
  start_time: "18:00"
  end_time: "23:59"

good_seat:
  # true면 "적당히 괜찮은 자리(중간 블록일 가능성이 높은 수준)"가 나올 때만 알림.
  # false면 기존 방식대로 좌석이 1석이라도 남으면 즉시 알림(예매 오픈 감지 그대로).
  #
  # 실제 좌석 위치는 CGV 로그인 후에만 볼 수 있어(비회원 접근 불가), 이 값은
  # "잔여석 비율이 낮을수록 중앙 블록은 이미 팔리고 가장자리/맨 앞줄만 남았을
  # 가능성이 높다"는 경험적 가정에 기반한 근사치다. 정확한 판정이 아니다.
  enabled: false
  # 전체 좌석 대비 잔여석 비율이 이 값 이상이면 "괜찮은 자리"로 판단.
  min_free_ratio: 0.12

poll:
  # 날짜 범위 내에서 매 tick마다 하루씩 순환 조회하므로,
  # 범위가 넓어져도 초당 요청 수는 이 값으로 고정된다.
  interval_seconds: 20.0
  jitter_seconds: 2.0
  # 세션(쿠키) 재발급 주기
  session_refresh_minutes: 30
  # 오류 시 백오프 (초)
  backoff_initial_seconds: 5
  backoff_max_seconds: 300
  # 새 구독자(/start, /stop) 메시지를 확인하는 주기 (초)
  subscriber_poll_seconds: 5

alerts:
  # 좌석이 남아있는 동안 재알림 주기 (분)
  repeat_minutes: 2
  # 정상 작동 알림 주기 (분)
  heartbeat_minutes: 60
